const D={"title": "Is a \"Digital Detox\" a Good Idea?", "sent": [{"text": "In our modern world, many of us are constantly connected.", "p": 0, "vi": "Trong thế giới hiện đại, nhiều người trong chúng ta luôn kết nối.", "chunks": ["In our modern world,", "many of us", "are constantly connected."], "start": 0, "end": 5.08225}, {"text": "We use our smartphones, laptops, and tablets for work, socialising, and entertainment.", "p": 0, "vi": "Chúng ta dùng điện thoại thông minh, máy tính xách tay và máy tính bảng để làm việc, giao tiếp và giải trí.", "chunks": ["We use", "our smartphones, laptops, and tablets", "for work, socialising, and entertainment."], "start": 5.41, "end": 12.6685}, {"text": "But what happens when our screen time becomes too much?", "p": 0, "vi": "Nhưng điều gì xảy ra khi thời gian sử dụng màn hình trở nên quá nhiều?", "chunks": ["But what happens", "when our screen time", "becomes too much?"], "start": 13.25, "end": 17.006700000000002}, {"text": "Some people believe the answer is a \"digital detox\": a period of time when you deliberately stop using all your electronic devices.", "p": 0, "vi": "Một số người cho rằng câu trả lời là “cai thiết bị số”: một khoảng thời gian bạn chủ động ngừng sử dụng tất cả thiết bị điện tử.", "chunks": ["Some people believe", "the answer is a \"digital detox\":", "a period of time", "when you deliberately stop using", "all your electronic devices."], "start": 17.31, "end": 26.6705}, {"text": "The benefits of a digital detox can be significant.", "p": 1, "vi": "Lợi ích của việc tạm ngừng sử dụng thiết bị số có thể rất đáng kể.", "chunks": ["The benefits of a digital detox", "can be", "significant."], "start": 27.09, "end": 31.0381}, {"text": "If you disconnect from your devices, you might find you have more time for face-to-face conversations with friends and family.", "p": 1, "vi": "Nếu ngắt kết nối với các thiết bị, bạn có thể thấy mình có nhiều thời gian hơn để trò chuyện trực tiếp với bạn bè và gia đình.", "chunks": ["If you disconnect from your devices,", "you might find", "you have more time", "for face-to-face conversations", "with friends and family."], "start": 31.47, "end": 39.800999999999995}, {"text": "It could also improve your mental health.", "p": 1, "vi": "Điều đó cũng có thể cải thiện sức khỏe tinh thần của bạn.", "chunks": ["It could also", "improve", "your mental health."], "start": 40.21, "end": 42.383399999999995}, {"text": "Constantly seeing notifications and news updates can cause stress and anxiety.", "p": 1, "vi": "Việc liên tục nhìn thấy thông báo và tin tức cập nhật có thể gây căng thẳng và lo âu.", "chunks": ["Constantly seeing notifications and news updates", "can cause", "stress and anxiety."], "start": 42.79, "end": 48.6357}, {"text": "Taking a break allows your mind to relax and focus on the world around you.", "p": 1, "vi": "Nghỉ một chút giúp tâm trí bạn thư giãn và tập trung vào thế giới xung quanh.", "chunks": ["Taking a break", "allows your mind to relax", "and focus on", "the world around you."], "start": 49.03, "end": 53.9888}, {"text": "Many people also report that they sleep better when they stop looking at screens before bed.", "p": 1, "vi": "Nhiều người cũng cho biết họ ngủ ngon hơn khi ngừng nhìn vào màn hình trước giờ ngủ.", "chunks": ["Many people also report", "that they sleep better", "when they stop looking at screens", "before bed."], "start": 54.75, "end": 60.166399999999996}, {"text": "However, there are also some clear drawbacks.", "p": 2, "vi": "Tuy nhiên, cũng có một số bất lợi rõ ràng.", "chunks": ["However,", "there are also", "some clear drawbacks."], "start": 60.91, "end": 64.1189}, {"text": "In today's world, it can be very difficult to disconnect completely.", "p": 2, "vi": "Trong thế giới ngày nay, việc ngắt kết nối hoàn toàn có thể rất khó.", "chunks": ["In today's world,", "it can be very difficult", "to disconnect completely."], "start": 64.61000000000001, "end": 69.1143}, {"text": "Many people need their phones and computers for their jobs.", "p": 2, "vi": "Nhiều người cần điện thoại và máy tính cho công việc.", "chunks": ["Many people", "need their phones and computers", "for their jobs."], "start": 69.59, "end": 73.1239}, {"text": "We also use them for important things like navigation, online banking, and staying in touch with family who live far away.", "p": 2, "vi": "Chúng ta cũng dùng chúng cho những việc quan trọng như tìm đường, giao dịch ngân hàng trực tuyến và giữ liên lạc với người thân sống xa.", "chunks": ["We also use them", "for important things", "like navigation, online banking,", "and staying in touch with family", "who live far away."], "start": 73.47000000000001, "end": 81.31580000000001}, {"text": "Trying to disconnect can sometimes create more anxiety if you feel you are missing important information or messages.", "p": 2, "vi": "Cố gắng ngắt kết nối đôi khi có thể khiến bạn lo âu hơn nếu cảm thấy mình đang bỏ lỡ thông tin hoặc tin nhắn quan trọng.", "chunks": ["Trying to disconnect", "can sometimes create more anxiety", "if you feel", "you are missing important information or messages."], "start": 81.81, "end": 89.15480000000001}, {"text": "It can also be hard to resist the habit of checking your phone.", "p": 2, "vi": "Việc cưỡng lại thói quen kiểm tra điện thoại cũng có thể khó khăn.", "chunks": ["It can also be hard", "to resist the habit", "of checking your phone."], "start": 89.49000000000001, "end": 92.7852}, {"text": "Perhaps a full detox is not the answer for everyone.", "p": 3, "vi": "Có lẽ ngừng sử dụng hoàn toàn thiết bị số không phải là giải pháp cho tất cả mọi người.", "chunks": ["Perhaps a full detox", "is not the answer", "for everyone."], "start": 93.41000000000001, "end": 97.2769}, {"text": "A more realistic approach might be to set smaller goals, like having a \"no-phone\" rule during dinner or turning off notifications for an hour each evening.", "p": 3, "vi": "Cách tiếp cận thực tế hơn có thể là đặt ra các mục tiêu nhỏ hơn, như không d e realistic approach might be to set smaller goals, like having a \"no-phone\" rule during dinner or turning off notifications for an hour each evening. This way, you can find a healthy balance between your online and offline life."], "qs": [["According to the text, why might someone decide to do a 'digital detox'?", ["Because their friends and family have asked them to.", "Because their phone is old and needs to be replaced.", "Because their screen time has become excessive.", "To learn how to use their devices more effectively."], 2, [2, 3], "C đúng: thời gian dùng màn hình quá nhiều là lý do tìm đến digital detox. A, B, D không được nêu.", "screen time becomes too much = thời gian dùng màn hình trở nên quá nhiều"], ["According to the article, what is a benefit of a digital detox?", ["It could cause you to sleep better.", "You can finish your work more quickly.", "It helps you develop new hobbies and interests.", "It can help you find a new job."], 0, [9], "A đúng: ngừng nhìn màn hình trước giờ ngủ có thể giúp ngủ ngon hơn. B, C, D không được bài xác nhận.", "sleep better = ngủ ngon hơn"], ["What is one reason why disconnecting completely is difficult?", ["It is against the law to turn off your phone.", "It can make your friends angry with you.", "Electronic devices are very expensive.", "People rely on technology for their work."], 3, [12], "D đúng: nhiều người cần điện thoại và máy tính cho công việc. A, B, C không phải lý do trong bài.", "for their jobs = phục vụ công việc của họ"], ["The article lists several benefits of a digital detox. Which of the following is NOT mentioned as a benefit?", ["Improving the quality of your sleep.", "Becoming better at using technology.", "Feeling less stress and anxiety.", "Having more time for conversations with family."], 1, [5, 7, 8, 9], "Chú ý NOT. B không được đề cập. A: ngủ ngon hơn; C: tâm trí thư giãn; D: có thêm thời gian trò chuyện — đều có trong bài.", "NOT mentioned = không được đề cập"], ["What does the writer suggest as a more 'realistic approach'?", ["Asking your company for a full digital detox week.", "Creating limited phone-free periods.", "Only using your phone for emergencies.", "Selling all of your electronic devices."], 1, [17], "B đúng: tạo những khoảng thời gian ngắn không dùng điện thoại. A, C, D không phải đề xuất của tác giả.", "set smaller goals = đặt ra các mục tiêu nhỏ hơn"], ["What is an implied result of disconnecting from devices?", ["You may have more time for offline activities.", "You might spend less money on shopping.", "Your internet speed at home will improve.", "You will probably become bored very quickly."], 0, [5, 8], "A đúng: từ việc có thêm thời gian trò chuyện và chú ý thế giới xung quanh, suy ra có thêm thời gian cho hoạt động ngoại tuyến. B, C, D không có căn cứ.", "offline activities = hoạt động không qua mạng"]], "phrases": [["screen time", "thời gian sử dụng màn hình", 2, "/ˈskriːn taɪm/"], ["electronic devices", "thiết bị điện tử", 3, "/ɪˌlekˈtrɒnɪk dɪˈvaɪsɪz/"], ["face-to-face conversations", "những cuộc trò chuyện trực tiếp", 5, "/ˌfeɪs tə ˈfeɪs ˌkɒnvəˈseɪʃənz/"], ["mental health", "sức khỏe tinh thần", 6, "/ˌmentəl ˈhelθ/"], ["stress and anxiety", "căng thẳng và lo âu", 7, "/stres ənd æŋˈzaɪəti/"], ["Taking a break", "nghỉ một chút", 8, "/ˈteɪkɪŋ ə breɪk/"], ["focus on", "tập trung vào", 8, "/ˈfəʊkəs ɒn/"], ["staying in touch with", "giữ liên lạc với", 13, "/ˈsteɪɪŋ ɪn tʌtʃ wɪð/"], ["a more realistic approach", "một cách tiếp cận thực tế hơn", 17, "/ə mɔː ˌrɪəˈlɪstɪk əˈprəʊtʃ/"], ["set smaller goals", "đặt ra các mục tiêu nhỏ hơn", 17, "/set ˈsmɔːlə ɡəʊlz/"], ["turning off notifications", "tắt thông báo", 17, "/ˈtɜːnɪŋ ɒf ˌnəʊtɪfɪˈkeɪʃənz/"], ["a healthy balance", "sự cân bằng lành mạnh", 18, "/ə ˈhelθi ˈbæləns/"]]},S=D.sent,Q=D.qs,P=D.phrases,$=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='home',si=0,qi=0,ci=0,chosen=[],completed=new Set(),answers={},checked=new Set(),cardOrder=P.map((_,i)=>i),remembered=new Set(),reviewOnly=false,flipped=false,manual=S.map(s=>Array(s.text.length).fill(null)),history=[],savedRange=null,clipEnd=null,request=0,raf=0,active=-1;const audio=$('#audio');

function paintPlaying(i){if(i===active)return;all('.playing').forEach(x=>x.classList.remove('playing'));active=i;if(i>=0)all('[data-s="'+i+'"]').forEach(x=>x.classList.add('playing'))}
function tick(){if(clipEnd!==null&&audio.currentTime>=clipEnd){audio.pause();clipEnd=null;paintPlaying(-1);return}let i=S.findIndex(s=>audio.currentTime>=s.start&&audio.currentTime<s.end);paintPlaying(audio.paused?-1:i);if(!audio.paused)raf=requestAnimationFrame(tick)}
async function listen(i){pauseForChange();let r=request;try{if(audio.readyState<1)await new Promise((resolve,reject)=>{audio.addEventListener('loadedmetadata',resolve,{once:true});audio.addEventListener('error',reject,{once:true})});if(r!==request)return;audio.currentTime=S[i].start;clipEnd=S[i].end;await audio.play();if(r!==request)audio.pause()}catch(e){if(r===request)alert('Audio could not be played. Keep digital-detox.mp3 beside index.html.')}}
audio.addEventListener('play',()=>{cancelAnimationFrame(raf);tick()});audio.addEventListener('pause',()=>{cancelAnimationFrame(raf);paintPlaying(-1)});audio.addEventListener('seeked',()=>{cancelAnimationFrame(raf);if(clipEnd!==null&&audio.currentTime>=clipEnd)clipEnd=null;tick()});audio.addEventListener('ended',()=>{clipEnd=null;paintPlaying(-1)});$('#stop').onclick=stop;$('#speed').onchange=e=>audio.playbackRate=+e.target.value;
function phraseAt(text,pos){return P.findIndex(p=>text.slice(pos,pos+p[0].length).toLowerCase()===p[0].toLowerCase())}
function sentenceHTML(i){const t=S[i].text;let h='',pos=0;while(pos<t.length){let p=phraseAt(t,pos);if(p>=0){let end=pos+P[p][0].length;h+='<span class="phrase" role="button" tabindex="0" data-phrase="'+p+'">'+letters(i,pos,end)+'</span>';pos=end}else{h+=letters(i,pos,pos+1);pos++}}return '<span class="sentence" data-s="'+i+'">'+h+'</span>'}
function letters(i,a,b){return Array.from(S[i].text.slice(a,b)).map((c,k)=>'<span data-char="'+(a+k)+'"'+(manual[i][a+k]?' class="'+manual[i][a+k]+'"':'')+'>'+esc(c)+'</span>').join('')}

function bindReading(){all('[data-phrase]').forEach(el=>{function show(){if(window.getSelection().toString())return;let n=+el.dataset.phrase,p=P[n];ci=cardOrder.indexOf(n);if(ci<0){reviewOnly=false;cardOrder=P.map((_,i)=>i);ci=n}$('#phraseInfo').innerHTML='<h2>'+esc(p[0])+'</h2><p class="vi" style="display:block">'+esc(p[1])+'</p>';$('#phraseDialog').showModal()}el.onclick=show;el.onkeydown=e=>{if(e.key==='Enter')show()}});all('[data-mark]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>mark(b.dataset.mark)})}
function mark(kind){if(kind==='undo'){if(history.length)manual=history.pop();refreshReading();return}if(kind==='clear'){history.push(manual.map(a=>a.slice()));manual=S.map(s=>Array(s.text.length).fill(null));refreshReading();return}if(!savedRange)return;let chars=all('.reading [data-char]').filter(x=>{try{return savedRange.intersectsNode(x)}catch{return false}});if(!chars.length)return;history.push(manual.map(a=>a.slice()));chars.forEach(x=>manual[+x.closest('[data-s]').dataset.s][+x.dataset.char]=kind==='erase'?null:kind);window.getSelection().removeAllRanges();savedRange=null;refreshReading()}

function switchView(v){pauseForChange();view=v;all('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
all('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#vi').onclick=()=>{document.body.classList.toggle('hidevi');$('#vi').textContent=document.body.classList.contains('hidevi')?'VI OFF':'VI ON'};$('#phrases').onclick=()=>{document.body.classList.toggle('nophrases');$('#phrases').textContent=document.body.classList.contains('nophrases')?'Key phrases OFF':'Key phrases ON'};$('#closeDialog').onclick=()=>$('#phraseDialog').close();$('#openCard').onclick=()=>{$('#phraseDialog').close();flipped=false;switchView('cards')};
function render(){if(view==='home'){$('#main').innerHTML='<section class="panel"><div class="row spread"><h2>'+esc(D.title)+'</h2><span class="badge">4 paragraphs · 19 sentences · 6 questions</span></div>'+toolbar()+reading()+'</section>';bindReading()}if(view==='sentence')builder();if(view==='drilling')drill();if(view==='cards')cards()}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>1&&b.every((x,i)=>x===a[i]))b.push(b.shift());return b}
let bankOrders=S.map(s=>shuffle(s.chunks.map((_,i)=>i))),sentenceChoices=S.map(()=>[]);
function builder(){chosen=sentenceChoices[si];let s=S[si];$('#main').innerHTML='<section class="panel"><div class="muted">SENTENCE BUILDER · Paragraph '+(s.p+1)+'</div><div class="row spread"><h2>Sentence '+(si+1)+' / '+S.length+'</h2><label>Go to sentence <select id="go">'+S.map((s,i)=>'<option value="'+i+'" '+(i===si?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label></div><div class="hint"><div class="row spread"><b>VIETNAMESE HINT</b><button id="hideHint">Hide</button></div><p id="hintvi">'+esc(s.vi)+'</p></div><div class="row"><button id="listen">▶ Listen to sentence</button><button id="sentenceStop">■ Stop</button></div><div id="target" class="target"></div><div id="bank" class="bank"></div><div class="toolbar"><button id="checkSentence" class="primary">Check</button><button id="hintSentence">Hint</button><button id="clearSentence">Clear</button><button id="showSentence">Show Answer</button></div><div id="sentenceFeedback" class="status" aria-live="polite"></div><div class="row spread"><button id="prev" '+(si===0?'disabled':'')+'>← Prev</button><span id="progress">'+completed.size+'/'+S.length+' complete</span><button id="next" '+(si===S.length-1?'disabled':'')+'>Next →</button></div></section>';drawChunks();$('#go').onchange=e=>moveSentence(+e.target.value);$('#prev').onclick=()=>moveSentence(si-1);$('#next').onclick=()=>moveSentence(si+1);$('#listen').onclick=()=>listen(si);$('#sentenceStop').onclick=stop;$('#hideHint').onclick=e=>{let h=$('#hintvi');h.hidden=!h.hidden;e.target.textContent=h.hidden?'Show':'Hide'};$('#clearSentence').onclick=()=>{sentenceChoices[si]=[];bankOrders[si]=shuffle(s.chunks.map((_,i)=>i));builder()};$('#hintSentence').onclick=()=>$('#sentenceFeedback').textContent='Mở đầu: '+s.chunks[0];$('#showSentence').onclick=()=>$('#sentenceFeedback').textContent=s.text;$('#checkSentence').onclick=()=>{let ok=chosen.length===s.chunks.length&&chosen.every((x,i)=>x===i);if(ok)completed.add(si);$('#sentenceFeedback').textContent=ok?'Đúng thứ tự câu gốc.':'Chưa khớp thứ tự bài gốc. Hãy thử lại.';$('#progress').textContent=completed.size+'/'+S.length+' complete'}}
function drawChunks(){let s=S[si];$('#target').innerHTML=chosen.length?chosen.map((n,k)=>'<button class="chunk" data-remove="'+k+'">'+esc(s.chunks[n])+'</button>').join(''):'<span class="muted">Tap the chunks to build the original sentence.</span>';$('#bank').innerHTML=bankOrders[si].filter(n=>!chosen.includes(n)).map(n=>'<button class="chunk" data-add="'+n+'">'+esc(s.chunks[n])+'</button>').join('');all('[data-add]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.add);drawChunks()});all('[data-remove]').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.remove,1);drawChunks()})}
function moveSentence(i){pauseForChange();si=i;builder()}
function drill(){let q=Q[qi];$('#main').innerHTML='<section class="panel"><div class="row spread"><h2>Find the evidence</h2><span class="badge" id="score">'+score()+' / '+Q.length+' correct</span></div>'+toolbar()+'<div class="drill"><div>'+reading()+'</div><div class="question"><label>Go to question <select id="qgo">'+Q.map((q,i)=>'<option value="'+i+'" '+(i===qi?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label><h3>'+String(qi+1)+'. '+esc(q[0])+'</h3>'+q[1].map((o,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(answers[qi]===j?'checked':'')+'><span><b>'+String.fromCharCode(65+j)+'.</b> '+esc(o)+'</span></label>').join('')+'<button id="qcheck" class="primary">Check</button><div id="qfeedback" aria-live="polite"></div><div class="row spread" style="margin-top:24px"><button id="qprev" '+(qi===0?'disabled':'')+'>← Prev</button><span>'+(qi+1)+' / '+Q.length+'</span><button id="qnext" '+(qi===Q.length-1?'disabled':'')+'>Next →</button></div></div></div></section>';bindReading();$('#qgo').onchange=e=>moveQ(+e.target.value);$('#qprev').onclick=()=>moveQ(qi-1);$('#qnext').onclick=()=>moveQ(qi+1);all('[name=answer]').forEach(r=>r.onchange=()=>{answers[qi]=+r.value;checked.delete(qi);$('#qfeedback').innerHTML='';evidence();$('#score').textContent=score()+' / '+Q.length+' correct'});$('#qcheck').onclick=()=>{if(answers[qi]===undefined){$('#qfeedback').textContent='Choose an answer first.';return}checked.add(qi);showFeedback()};if(checked.has(qi))showFeedback()}
function score(){return [...checked].filter(i=>answers[i]===Q[i][2]).length}
function showFeedback(){let q=Q[qi],ok=answers[qi]===q[2];$('#qfeedback').innerHTML='<div class="feedback"><b>'+(ok?'Correct':'Not quite')+' · '+String.fromCharCode(65+q[2])+'</b><p>'+esc(q[4])+'</p><p><strong>'+esc(q[5])+'</strong></p><small>Paragraph '+[...new Set(q[3].map(i=>S[i].p+1))].join(', ')+' · Evidence highlighted in the reading.</small></div>';$('#score').textContent=score()+' / '+Q.length+' correct';evidence()}
function evidence(){all('.evidence').forEach(x=>x.classList.remove('evidence'));if(view==='drilling'&&checked.has(qi))Q[qi][3].forEach(i=>all('[data-s="'+i+'"]').forEach(x=>x.classList.add('evidence')))}
function moveQ(i){pauseForChange();qi=i;drill()}
function cards(){let order=reviewOnly?cardOrder.filter(n=>!remembered.has(n)):cardOrder;if(ci>=order.length)ci=0;let n=order[ci],p=P[n];if(!p){$('#main').innerHTML='<section class="panel card"><h2>All cards remembered!</h2><button id="allCards">Show all cards</button></section>';$('#allCards').onclick=()=>{reviewOnly=false;ci=0;cards()};return}let s=S[p[2]];$('#main').innerHTML='<section class="panel card"><div class="row spread"><span class="muted">USEFUL CHUNK · '+(ci+1)+' / '+order.length+'</span><span class="badge">'+remembered.size+' remembered</span></div><h2>'+esc(p[0])+'</h2><button id="flip" class="primary">'+(flipped?'Hide':'Show')+' answer</button>'+(flipped?'<div><p>'+esc(p[3])+'</p><p class="meaning">'+esc(p[1])+'</p><p class="source">'+esc(s.text).replace(new RegExp(p[0],'i'),m=>'<strong class="phrase">'+m+'</strong>')+'</p><p class="meaning" style="font-size:18px;text-align:left">'+esc(s.vi)+'</p><p class="muted">Pattern: '+esc(p[0])+'</p></div>':'')+'<div class="toolbar" style="justify-content:center"><button id="cardListen">▶ Listen to sentence</button><button id="cardStop">■ Stop</button><button id="sourceSentence">Go to sentence '+(p[2]+1)+'</button></div><div class="toolbar" style="justify-content:center"><button id="learned">'+(remembered.has(n)?'✓ Remembered':'Mark remembered')+'</button><button id="review">Needs review</button><button id="filter">'+(reviewOnly?'Show all':'Review only')+'</button><button id="shuffle">Shuffle</button><button id="resetCards">Reset cards</button></div><div class="row spread"><button id="cardPrev" '+(ci===0?'disabled':'')+'>← Prev</button><button id="cardNext" '+(ci===order.length-1?'disabled':'')+'>Next →</button></div></section>';$('#flip').onclick=()=>{flipped=!flipped;cards()};$('#cardListen').onclick=()=>listen(p[2]);$('#cardStop').onclick=stop;$('#sourceSentence').onclick=()=>{si=p[2];switchView('sentence')};$('#cardPrev').onclick=()=>moveCard(ci-1);$('#cardNext').onclick=()=>moveCard(ci+1);$('#learned').onclick=()=>{remembered.add(n);pauseForChange();cards()};$('#review').onclick=()=>{remembered.delete(n);cards()};$('#filter').onclick=()=>{reviewOnly=!reviewOnly;moveCard(0)};$('#shuffle').onclick=()=>{cardOrder=shuffle(cardOrder);moveCard(0)};$('#resetCards').onclick=()=>{remembered.clear();reviewOnly=false;cardOrder=P.map((_,i)=>i);moveCard(0)}}
function moveCard(i){pauseForChange();ci=i;flipped=false;cards()}
$('#reset').onclick=()=>{stop();si=qi=ci=0;completed.clear();answers={};checked.clear();remembered.clear();reviewOnly=false;flipped=false;sentenceChoices=S.map(()=>[]);bankOrders=S.map(s=>shuffle(s.chunks.map((_,i)=>i)));manual=S.map(s=>Array(s.text.length).fill(null));history=[];document.body.className='hidevi';$('#vi').textContent='VI OFF';$('#phrases').textContent='Key phrases ON';audio.playbackRate=1;$('#speed').value='1';switchView('home')};render();
</script></body></html>
